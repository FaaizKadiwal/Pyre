# Render Blueprint. In the Render dashboard choose "New > Blueprint", pick this
# repository, and the service below is created with these settings.
# Reference: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: card-game
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      # Optional. Paste a Postgres connection string (Neon, Supabase, ...) in the
      # dashboard to keep the leaderboard across restarts. Leave empty for in-memory.
      - key: DATABASE_URL
        sync: false
